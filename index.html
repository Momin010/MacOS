<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacOS Simulation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Menu Bar -->
    <div id="menu-bar">
        <div class="menu-item">Apple</div>
        <div class="menu-item">Finder</div>
        <div class="menu-item">File</div>
        <div class="menu-item">Edit</div>
        <div class="menu-item">View</div>
        <div class="menu-item">Go</div>
        <div class="menu-item">Window</div>
        <div class="menu-item">Help</div>
        <div class="right-menu">
            <div class="menu-item">Wi-Fi</div>
            <div class="menu-item">Battery</div>
            <div class="menu-item">Time</div>
        </div>
    </div>

    <!-- Desktop -->
    <div id="desktop">
        <!-- Desktop Icons -->
        <div class="desktop-icon" data-app="finder">
            <img src="icons/finder.png" alt="Finder">
            <span>Finder</span>
        </div>
        <div class="desktop-icon" data-app="safari">
            <img src="icons/safari.png" alt="Safari">
            <span>Safari</span>
        </div>
        <div class="desktop-icon" data-app="calculator">
            <img src="icons/calculator.png" alt="Calculator">
            <span>Calculator</span>
        </div>
        <div class="desktop-icon" data-app="notes">
            <img src="icons/notes.png" alt="Notes">
            <span>Notes</span>
        </div>
        <div class="desktop-icon" data-app="terminal">
            <img src="icons/terminal.png" alt="Terminal">
            <span>Terminal</span>
        </div>
        <div class="desktop-icon" data-app="settings">
            <img src="icons/settings.png" alt="System Preferences">
            <span>System Preferences</span>
        </div>
    </div>

    <!-- Dock -->
    <div id="dock">
        <div class="dock-item" data-app="finder">
            <img src="icons/finder.png" alt="Finder">
        </div>
        <div class="dock-item" data-app="safari">
            <img src="icons/safari.png" alt="Safari">
        </div>
        <div class="dock-item" data-app="calculator">
            <img src="icons/calculator.png" alt="Calculator">
        </div>
        <div class="dock-item" data-app="notes">
            <img src="icons/notes.png" alt="Notes">
        </div>
        <div class="dock-item" data-app="terminal">
            <img src="icons/terminal.png" alt="Terminal">
        </div>
        <div class="dock-item" data-app="settings">
            <img src="icons/settings.png" alt="System Preferences">
        </div>
    </div>

    <!-- Windows Container -->
    <div id="windows-container"></div>

    <script src="script.js"></script>
    <script src="windows.js"></script>
    <script src="finder.js"></script>
    <script src="safari.js"></script>
    <script src="calculator.js"></script>
    <script src="notes.js"></script>
    <script src="terminal.js"></script>
    <script src="settings.js"></script>
</body>
</html>
